<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgLife" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051628" />
      <stop offset="50%" stop-color="#0B2447" />
      <stop offset="100%" stop-color="#123B5D" />
    </linearGradient>
    <linearGradient id="tealGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFECE7" />
      <stop offset="50%" stop-color="#5FC9C0" />
      <stop offset="100%" stop-color="#1F9E96" />
    </linearGradient>
    <radialGradient id="glowLife" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5FC9C0" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0B2447" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgLife)" />
  <circle cx="600" cy="315" r="260" fill="url(#glowLife)" />

  <!-- Harmonious Nutrition, Pure Hydration & Lifestyle Balance -->
  <g transform="translate(600, 315)">
    <!-- Plate / Balance Circle -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#tealGrad6)" stroke-width="4.5" />
    <circle cx="0" cy="0" r="175" fill="none" stroke="url(#tealGrad6)" stroke-width="1.8" stroke-dasharray="10 8" opacity="0.6" />

    <!-- Pure Water Drop and Plant Leaf Harmony -->
    <!-- Water Drop (Left/Center) -->
    <path d="M-30 -70 C-10 -30 5 -5 5 20 C5 48 -15 65 -35 65 C-55 65 -75 48 -75 20 C-75 -5 -60 -30 -30 -70 Z" 
          fill="url(#tealGrad6)" opacity="0.3" stroke="url(#tealGrad6)" stroke-width="3" />

    <!-- Botanical Nutrition Leaf (Right/Center) -->
    <path d="M10 -70 C60 -70 85 -20 85 30 C85 70 50 85 20 85 C-20 85 5 40 10 -70 Z" 
          fill="none" stroke="#BFECE7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Leaf Vein -->
    <path d="M10 -70 C30 -20 40 20 20 85" fill="none" stroke="#BFECE7" stroke-width="2" />
    <line x1="28" y1="-20" x2="55" y2="-30" stroke="#BFECE7" stroke-width="1.8" />
    <line x1="33" y1="10" x2="65" y2="5" stroke="#BFECE7" stroke-width="1.8" />

    <!-- Balanced Lifestyle Indicators -->
    <circle cx="-190" cy="-40" r="6" fill="#5FC9C0" />
    <circle cx="190" cy="40" r="6" fill="#5FC9C0" />
    <circle cx="0" cy="200" r="5" fill="#BFECE7" />
  </g>

  <rect x="24" y="24" width="1152" height="582" rx="18" fill="none" stroke="url(#tealGrad6)" stroke-width="1.5" opacity="0.3" />
</svg>
