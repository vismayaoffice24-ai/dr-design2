<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgCreat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051425" />
      <stop offset="50%" stop-color="#0B2447" />
      <stop offset="100%" stop-color="#0F3358" />
    </linearGradient>
    <linearGradient id="tealGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFECE7" />
      <stop offset="50%" stop-color="#5FC9C0" />
      <stop offset="100%" stop-color="#1F9E96" />
    </linearGradient>
    <radialGradient id="glowCreat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5FC9C0" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0B2447" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgCreat)" />
  <circle cx="600" cy="315" r="260" fill="url(#glowCreat)" />

  <!-- Laboratory Flask & Precision Dial Filtration -->
  <g transform="translate(600, 315)">
    <!-- Lab Flask Silhouette -->
    <path d="M-30 -140 L30 -140 L30 -60 L110 80 C125 105 105 130 75 130 L-75 130 C-105 130 -125 105 -110 80 L-30 -60 Z" 
          fill="none" stroke="url(#tealGrad4)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Liquid Level in Flask -->
    <path d="M-85 60 C-50 45 0 70 50 50 L85 60 L75 130 L-75 130 Z" 
          fill="url(#tealGrad4)" opacity="0.25" stroke="#BFECE7" stroke-width="2" />

    <!-- Measurement Calibration Marks -->
    <line x1="-20" y1="-30" x2="5" y2="-30" stroke="#BFECE7" stroke-width="2.5" />
    <line x1="-35" y1="0" x2="-5" y2="0" stroke="#BFECE7" stroke-width="2.5" />
    <line x1="-50" y1="30" x2="-15" y2="30" stroke="#BFECE7" stroke-width="2.5" />

    <!-- Precision Meter Arc -->
    <path d="M-190 20 A 190 190 0 0 1 190 20" fill="none" stroke="url(#tealGrad4)" stroke-width="3" stroke-dasharray="8 6" opacity="0.75" />
    
    <!-- Stable Metric Dots -->
    <circle cx="-190" cy="20" r="6" fill="#5FC9C0" />
    <circle cx="0" cy="-170" r="6" fill="#BFECE7" />
    <circle cx="190" cy="20" r="6" fill="#5FC9C0" />
  </g>

  <rect x="24" y="24" width="1152" height="582" rx="18" fill="none" stroke="url(#tealGrad4)" stroke-width="1.5" opacity="0.3" />
</svg>
