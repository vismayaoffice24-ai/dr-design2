<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgDiab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051527" />
      <stop offset="50%" stop-color="#0B2447" />
      <stop offset="100%" stop-color="#11365C" />
    </linearGradient>
    <linearGradient id="tealGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFECE7" />
      <stop offset="50%" stop-color="#5FC9C0" />
      <stop offset="100%" stop-color="#1F9E96" />
    </linearGradient>
    <radialGradient id="glowDiab" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5FC9C0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B2447" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgDiab)" />
  <circle cx="600" cy="315" r="260" fill="url(#glowDiab)" />

  <!-- Glucose Molecular Structure & Glomerular Filter -->
  <g transform="translate(600, 315)">
    <!-- Molecular Hexagon Framework -->
    <polygon points="0,-140 120,-70 120,70 0,140 -120,70 -120,-70" fill="none" stroke="url(#tealGrad3)" stroke-width="3" stroke-dasharray="10 6" opacity="0.6" />
    
    <!-- Central Glomerulus Blood Vessel Loop -->
    <path d="M-60 40 C-80 -40 -30 -100 0 -100 C30 -100 80 -40 60 40 C45 80 -45 80 -60 40 Z" 
          fill="none" stroke="url(#tealGrad3)" stroke-width="5" stroke-linecap="round" />
    <path d="M-30 20 C-40 -20 -15 -60 0 -60 C15 -60 40 -20 30 20 Z" 
          fill="none" stroke="#BFECE7" stroke-width="2.5" opacity="0.8" />

    <!-- Glucose Blood Glucose Balance Indicators -->
    <circle cx="-120" cy="-70" r="14" fill="#0B2447" stroke="url(#tealGrad3)" stroke-width="3" />
    <circle cx="120" cy="-70" r="14" fill="#0B2447" stroke="url(#tealGrad3)" stroke-width="3" />
    <circle cx="120" cy="70" r="14" fill="#0B2447" stroke="url(#tealGrad3)" stroke-width="3" />
    <circle cx="-120" cy="70" r="14" fill="#0B2447" stroke="url(#tealGrad3)" stroke-width="3" />
    <circle cx="0" cy="140" r="14" fill="#0B2447" stroke="url(#tealGrad3)" stroke-width="3" />
    <circle cx="0" cy="-140" r="14" fill="#0B2447" stroke="url(#tealGrad3)" stroke-width="3" />

    <!-- Protective Shield Line -->
    <line x1="-240" y1="0" x2="-140" y2="0" stroke="url(#tealGrad3)" stroke-width="2.5" />
    <line x1="140" y1="0" x2="240" y2="0" stroke="url(#tealGrad3)" stroke-width="2.5" />
  </g>

  <rect x="24" y="24" width="1152" height="582" rx="18" fill="none" stroke="url(#tealGrad3)" stroke-width="1.5" opacity="0.3" />
</svg>
